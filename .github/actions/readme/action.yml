name: README
description: >
  Renders README.md, at the root of the app, from its readme.yml in the standard layout, and commits it to the branch
  of the pull request when it differs. An app without a readme.yml yet only gets a warning. Used by the `readme` job
  of android_pr.yml; see docs/readme.md. The job needs `contents: write`.

runs:
  using: composite
  steps:
    - uses: LukeNeedham/ci-workflows/.github/actions/checkout-pr-branch@claude/standard-readme-format-382cvu

    - name: Render README.md from readme.yml
      shell: bash
      env:
        REPO: ${{ github.repository }}
      run: |
        pip install --quiet pyyaml
        python3 "$CI_SCRIPTS/generate_readme.py" . --repo "$REPO" --skip-if-missing

    - name: Commit README.md if it changed
      shell: bash
      run: python3 "$CI_SCRIPTS/commit_generated.py" readme
