name: Conventions
description: >
  Checks the Kotlin code of the app against the conventions of the docs (Koin modules only wire, no AndroidViewModel,
  acronyms are ordinary words, the page, ViewModel, sheet, preview and screenshot rules) and fails with an annotation on
  every line that breaks one. Used by the `conventions` job of android_pr.yml; the rules are in docs/lint.md and the logic
  is scripts/check_conventions.py (scripts/conventions/).

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - uses: LukeNeedham/ci-workflows/.github/actions/ci-scripts@main

    - name: Check the conventions
      shell: bash
      run: python3 "$CI_SCRIPTS/check_conventions.py" .
