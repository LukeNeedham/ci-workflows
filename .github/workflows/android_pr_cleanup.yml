name: Android PR Cleanup

# Building block of android_pr.yml: deletes the pre-releases (and their tags) created by
# android_pr_build.yml for a pull request's branch once the PR is closed, merged or not. Call
# android_pr.yml instead of this file.

on:
  workflow_call:

jobs:
  cleanup:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Same group as the build job: closing the PR cancels a build still running for it, so that
    # build cannot publish a release after this cleanup has already run.
    concurrency:
      group: android-pr-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: LukeNeedham/ci-workflows/.github/actions/ci-scripts@trial-previews

      - name: Delete PR build releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAW_BRANCH: ${{ github.head_ref }}
        run: python3 "$CI_SCRIPTS/pr_releases.py" cleanup --branch "$RAW_BRANCH"
