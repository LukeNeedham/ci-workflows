name: Android PR Cleanup

# Reusable workflow: deletes the pre-releases (and their tags) created by android_pr_build.yml for
# a pull request's branch once the PR is merged.
#
# Caller example:
#   on:
#     pull_request:
#       types: [closed]
#   permissions:
#     contents: write
#   jobs:
#     cleanup:
#       uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_cleanup.yml@main

on:
  workflow_call:
    inputs:
      merged-only:
        description: Only delete when the PR was merged (false also deletes when closed unmerged)
        type: boolean
        default: true

jobs:
  cleanup:
    if: github.event_name == 'pull_request' && (github.event.pull_request.merged == true || !inputs.merged-only)
    runs-on: ubuntu-latest
    # Same group as the build job: closing the PR cancels a build still running for it, so that
    # build cannot publish a release after this cleanup has already run.
    concurrency:
      group: android-pr-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Delete PR build releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RAW_BRANCH: ${{ github.head_ref }}
        run: |
          # Must match the tag scheme in android_pr_build.yml: <clean-branch>-<run_number>-<run_attempt>
          CLEAN_BRANCH=$(echo "$RAW_BRANCH" | sed 's/[^A-Za-z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')

          TAGS=$(gh release list --limit 1000 --json tagName,isPrerelease \
            | jq -r --arg p "${CLEAN_BRANCH}-" \
                '.[] | select(.isPrerelease and (.tagName | startswith($p))
                         and (.tagName[($p | length):] | test("^[0-9]+-[0-9]+$"))) | .tagName')

          if [ -z "$TAGS" ]; then
            echo "No PR build releases found for branch '$RAW_BRANCH'"
            exit 0
          fi

          while read -r tag; do
            echo "Deleting release and tag: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done <<< "$TAGS"
