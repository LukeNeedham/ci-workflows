name: Delete Pre-releases

# Reusable workflow: deletes ALL pre-releases (and their tags) in the calling repository.
# Intended to be run by hand to sweep up PR build releases that the automatic cleanup missed.
#
# Caller example:
#   on:
#     workflow_dispatch:
#   permissions:
#     contents: write
#   jobs:
#     delete:
#       uses: LukeNeedham/ci-workflows/.github/workflows/delete_prereleases.yml@main

on:
  workflow_call:

jobs:
  delete-prereleases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all pre-releases
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // Collect every pre-release BEFORE deleting anything. Paging while deleting shifts
            // later releases onto earlier pages, so the loop would skip some of them.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            const prereleases = releases.filter((release) => release.prerelease);
            console.log(`Found ${prereleases.length} pre-releases (of ${releases.length} releases)`);

            let deleted = 0;
            for (const release of prereleases) {
              console.log(`Deleting pre-release: ${release.tag_name} (id: ${release.id})`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${release.tag_name}` });
                console.log(`Deleted tag: ${release.tag_name}`);
              } catch (e) {
                console.log(`Tag ${release.tag_name} may not exist: ${e.message}`);
              }
              deleted++;
            }
            console.log(`Total pre-releases deleted: ${deleted}`);
