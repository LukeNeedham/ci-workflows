name: New App

# Creates a new app repo and sets it up: the repo (with a README, so that `main` exists), its first commit (the first
# sync and the basic scaffold), the secret GENERATED_COMMIT_TOKEN, and the entry in apps.json. Started by hand (*Actions
# -> New App -> Run workflow*) or by the New app button of AppHub, which calls the dispatch API. The logic is
# scripts/new_app.py; setup is docs/create-app.md. AppHub makes the repo itself, with a token of its own, and runs this
# with resume on, so no secret of this repo can create repos; NEW_APP_TOKEN is optional, for creating it from here.

# The run is named after the app, so that a program that started it (AppHub) can find its own run among the others
run-name: New App ${{ inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: The name of the app and of its repo (letters, digits, hyphens and underscores), for example LyricTutor
        type: string
        required: true
      private:
        description: Create a private repo (the default is public, which is what AppHub lists). Only used when the workflow creates the repo itself
        type: boolean
        default: false
      resume:
        description: The repo exists already (AppHub makes it, then runs this with resume on), or a run stopped half way. Needed unless NEW_APP_TOKEN is set
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    # With the sync: both change apps.json and push to the apps
    concurrency:
      group: sync-apps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - run: pip install --quiet pyyaml pynacl

      - name: Create the app
        env:
          NEW_APP_TOKEN: ${{ secrets.NEW_APP_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GENERATED_COMMIT_TOKEN: ${{ secrets.GENERATED_COMMIT_TOKEN }}
          APP_NAME: ${{ inputs.name }}
          PRIVATE: ${{ inputs.private }}
          RESUME: ${{ inputs.resume }}
        run: |
          args=()
          if [ "$PRIVATE" = "true" ]; then args+=(--private); fi
          if [ "$RESUME" = "true" ]; then args+=(--resume); fi
          python3 scripts/new_app.py "$APP_NAME" "${args[@]}"
