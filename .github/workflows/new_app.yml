name: New App

# Creates a new project repo and sets it up for its stack (kmp: an Android app; next-js: a website): the repo (with a README,
# so that `main` exists), its first commit (the first sync and a project that builds, from templates/new-app or
# templates/next-js), the secret GENERATED_COMMIT_TOKEN, and the entry in apps.json with the stack. Started by hand (*Actions
# -> New App -> Run workflow*) or by a program that calls the dispatch API. The logic is scripts/new_app.py; setup is
# docs/create-app.md. The caller makes the repo itself, with a token of its own, and runs this with resume on, so no secret of
# this repo can create repos; NEW_APP_TOKEN is optional, for creating it from here.

# The run is named after the app, so that a program that started it can find its own run among the others
run-name: New App ${{ inputs.name }}

on:
  workflow_dispatch:
    inputs:
      name:
        description: The name of the project and of its repo (letters, digits, hyphens and underscores), for example LyricTutor
        type: string
        required: true
      stack:
        description: What the project is built with, which decides how it is set up. There is no default
        type: choice
        options: [kmp, next-js]
        required: true
      private:
        description: Create a private repo (the default is public). Only used when the workflow creates the repo itself
        type: boolean
        default: false
      resume:
        description: The repo exists already (the caller makes it, then runs this with resume on), or a run stopped half way. Needed unless NEW_APP_TOKEN is set
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  create:
    runs-on: ubuntu-latest
    # With the sync: both change apps.json and push to the apps
    concurrency:
      group: sync-apps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The Node of the engines of a next-js project, and yarn, which make its yarn.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: pip install --quiet pyyaml pynacl

      - name: Create the app
        env:
          NEW_APP_TOKEN: ${{ secrets.NEW_APP_TOKEN }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GENERATED_COMMIT_TOKEN: ${{ secrets.GENERATED_COMMIT_TOKEN }}
          # Only for stack next-js: sets the website up on Vercel. Optional: without it that step is skipped and said so
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          APP_NAME: ${{ inputs.name }}
          STACK: ${{ inputs.stack }}
          PRIVATE: ${{ inputs.private }}
          RESUME: ${{ inputs.resume }}
        run: |
          args=()
          if [ "$PRIVATE" = "true" ]; then args+=(--private); fi
          if [ "$RESUME" = "true" ]; then args+=(--resume); fi
          python3 scripts/new_app.py "$APP_NAME" --stack "$STACK" "${args[@]}"
