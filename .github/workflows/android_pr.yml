name: Android PR

# Reusable workflow: the whole PR flow in one call. Builds and comments on the PR while it is open,
# and cleans up its build releases when it is closed. It simply picks android_pr_build.yml or
# android_pr_cleanup.yml from the event, so a project needs one caller job instead of two.
#
# Caller example: examples/trigger_on_pull_request.yml

on:
  workflow_call:
    # The defaults for the whole PR flow live here and only here: they are passed on explicitly to
    # android_pr_build.yml and android_pr_cleanup.yml, whose inputs are all required. apk-path has no
    # default because it depends on the project.
    inputs:
      gradle-task:
        description: Gradle task that produces the APK
        type: string
        default: assembleDebug
      apk-path:
        description: Path to the built APK, relative to the repo root (depends on the project, so no default)
        type: string
        required: true
      java-version:
        type: string
        default: '17'
      java-distribution:
        type: string
        default: zulu
      timezone:
        description: Timezone used for the timestamps
        type: string
        default: Europe/Amsterdam
      comment-header:
        description: Sticky comment id
        type: string
        default: example-app-link

jobs:
  # Every app exposes its icon at a fixed path so tooling such as the app hub can fetch it. Fails the
  # PR when it is missing, or not a square RGBA PNG of at least 512x512 drawn as a circle on a
  # transparent background. The path is fixed and cannot be overridden: it has to be the same in every
  # app. Runs alongside the build.
  check-icon:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the app icon
        env:
          ICON_PATH: app-icon.png
        run: |
          python3 - <<'PY'
          import os, struct, sys, zlib

          path = os.environ["ICON_PATH"]

          def fail(message):
              print(f"::error file={path}::{message} See https://github.com/LukeNeedham/ci-workflows/blob/main/docs/app-icon.md")
              sys.exit(1)

          if not os.path.isfile(path):
              fail(f"The app icon '{path}' is missing. Every app commits a 512x512 PNG there.")
          with open(path, "rb") as f:
              data = f.read()
          if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
              fail(f"'{path}' is not a PNG file.")
          width, height, depth, color, _, _, interlace = struct.unpack(">IIBBBBB", data[16:29])
          if width != height:
              fail(f"'{path}' must be square, but is {width}x{height}.")
          if width < 512:
              fail(f"'{path}' must be at least 512x512, but is {width}x{height}.")
          if (depth, color, interlace) != (8, 6, 0):
              fail(f"'{path}' must be an 8-bit RGBA PNG that is not interlaced (it must have transparency).")

          # Decode the pixels (RGBA, so 4 bytes each) to look at the corners and the centre
          idat, pos = b"", 8
          while pos < len(data):
              length, kind = struct.unpack(">I4s", data[pos:pos + 8])
              if kind == b"IDAT":
                  idat += data[pos + 8:pos + 8 + length]
              pos += 12 + length
          raw = zlib.decompress(idat)
          stride = width * 4
          rows, prev = [], bytearray(stride)
          for y in range(height):
              ft, line = raw[y * (stride + 1)], bytearray(raw[y * (stride + 1) + 1:(y + 1) * (stride + 1)])
              for i in range(stride):
                  a = line[i - 4] if i >= 4 else 0
                  b = prev[i]
                  c = prev[i - 4] if i >= 4 else 0
                  if ft == 1: line[i] = (line[i] + a) & 255
                  elif ft == 2: line[i] = (line[i] + b) & 255
                  elif ft == 3: line[i] = (line[i] + ((a + b) >> 1)) & 255
                  elif ft == 4:
                      p = a + b - c
                      pa, pb, pc = abs(p - a), abs(p - b), abs(p - c)
                      line[i] = (line[i] + (a if pa <= pb and pa <= pc else b if pb <= pc else c)) & 255
              rows.append(line)
              prev = line
          alpha = lambda x, y: rows[y][x * 4 + 3]
          last, mid, near = width - 1, width // 2, width // 10
          # Just inside each corner of the square is outside a circle (but not outside a rounded square)
          corners = [(0, 0), (last, 0), (0, last), (last, last), (near, near), (last - near, near), (near, last - near), (last - near, last - near)]
          if any(alpha(x, y) != 0 for x, y in corners):
              fail(f"'{path}' must be a circle with a transparent background, but its corners are not transparent.")
          if alpha(mid, mid) != 255:
              fail(f"'{path}' must be a circle filled with the icon, but its centre is not opaque.")
          print(f"{path}: {width}x{height} circular PNG, ok")
          PY

  build:
    # Everything except a PR being closed
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_build.yml@main
    with:
      gradle-task: ${{ inputs.gradle-task }}
      apk-path: ${{ inputs.apk-path }}
      java-version: ${{ inputs.java-version }}
      java-distribution: ${{ inputs.java-distribution }}
      timezone: ${{ inputs.timezone }}
      comment-header: ${{ inputs.comment-header }}

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_cleanup.yml@main
