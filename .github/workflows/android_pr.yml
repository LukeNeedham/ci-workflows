name: Android PR

# Reusable workflow: the whole PR flow in one call. Builds and comments on the PR while it is open,
# and cleans up its build releases when it is closed. It simply picks android_pr_build.yml or
# android_pr_cleanup.yml from the event, so a project needs one caller job instead of two. Nothing runs for a
# PR that targets a branch the app does not build, or that changes only the Claude skill (see config).
#
# Caller example: examples/trigger_on_pull_request.yml. It has no settings: everything is in apps.json.

on:
  workflow_call:
    # The app's settings (APK path, Gradle task, JDK, timezone, comment id, branches) are not inputs: the config
    # job looks them up in apps.json by the repo this runs in (docs/app-config.md).
    inputs:
      tools-ref:
        description: Branch or tag of LukeNeedham/ci-workflows to fetch scripts/ from. Leave as main; set it to a branch only to test a script change
        type: string
        default: main

jobs:
  # Looks up the app's settings in apps.json, and whether this run has anything to do. The other jobs wait for it.
  config:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.config.outputs.skip }}
      apk-path: ${{ steps.config.outputs.apk-path }}
      gradle-task: ${{ steps.config.outputs.gradle-task }}
      java-version: ${{ steps.config.outputs.java-version }}
      java-distribution: ${{ steps.config.outputs.java-distribution }}
      timezone: ${{ steps.config.outputs.timezone }}
      comment-header: ${{ steps.config.outputs.comment-header }}
    steps:
      - id: config
        uses: LukeNeedham/ci-workflows/.github/actions/app-config@main

  # Every app exposes its icon at a fixed path, app-icon.png in the repo root, so tooling such as the app
  # hub can fetch it. It is generated from the app's adaptive launcher icon, so it cannot drift: this job
  # renders it on every PR and, when it differs, commits it to the PR branch. The path is fixed and cannot
  # be overridden: it has to be the same in every app. Runs alongside the build.
  # Pushes made with the workflow token do not start new workflow runs, so there is no loop; they also
  # mean the checks do not run again on that commit (the APK does not contain app-icon.png).
  app-icon:
    needs: config
    if: needs.config.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The PR's own branch, not the merge commit, so the result can be pushed back to it
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Render the app icon
        env:
          TOOLS_REF: ${{ inputs.tools-ref }}
        run: |
          sudo apt-get install -y --no-install-recommends libcairo2 > /dev/null
          pip install --quiet cairosvg pillow
          curl -fsSL "https://raw.githubusercontent.com/LukeNeedham/ci-workflows/${TOOLS_REF}/scripts/render_app_icon.py" \
            -o "$RUNNER_TEMP/render_app_icon.py"
          python3 "$RUNNER_TEMP/render_app_icon.py" .

      - name: Commit the app icon if it changed
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- app-icon.png)" ]; then
            echo "app-icon.png is up to date"
            exit 0
          fi
          if [ "$IS_PR" != "true" ] || [ "$IS_FORK" = "true" ]; then
            echo "::error file=app-icon.png::app-icon.png does not match the adaptive launcher icon, and this run cannot commit it (it only does on a PR from this repo's own branches). Run scripts/render_app_icon.py (see docs/app-icon.md) and commit the result."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-icon.png
          git commit -m "Regenerate app-icon.png from the adaptive launcher icon"
          # A push to the branch since this run started makes the first push fail: rebase onto it and retry
          git push origin "HEAD:refs/heads/$BRANCH" || {
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:refs/heads/$BRANCH"
          }

  build:
    needs: config
    # Everything except a PR being closed
    if: needs.config.outputs.skip != 'true' && (github.event_name != 'pull_request' || github.event.action != 'closed')
    uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_build.yml@main
    with:
      gradle-task: ${{ needs.config.outputs.gradle-task }}
      apk-path: ${{ needs.config.outputs.apk-path }}
      java-version: ${{ needs.config.outputs.java-version }}
      java-distribution: ${{ needs.config.outputs.java-distribution }}
      timezone: ${{ needs.config.outputs.timezone }}
      comment-header: ${{ needs.config.outputs.comment-header }}

  cleanup:
    needs: config
    if: needs.config.outputs.skip != 'true' && github.event_name == 'pull_request' && github.event.action == 'closed'
    uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_cleanup.yml@main
