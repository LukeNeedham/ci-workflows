name: Android PR

# Reusable workflow: the whole PR flow in one call. Builds and comments on the PR while it is open,
# and cleans up its build releases when it is closed. It simply picks android_pr_build.yml or
# android_pr_cleanup.yml from the event, so a project needs one caller job instead of two. Nothing runs for a
# PR that targets a branch other than main, or that changes only the Claude skill (see config).
#
# Caller: callers/trigger_on_pull_request.yml. It has no settings: every app is built the same way.

on:
  # No inputs: every app is built the same way (docs/app-config.md)
  workflow_call:
    secrets:
      # A token of the owner, to push the generated files with, so that the checks run on that commit (docs/app-config.md).
      # Optional: without it the workflow token pushes, and the checks of the new commit wait for approval.
      GENERATED_COMMIT_TOKEN:
        required: false


jobs:
  # Provides the settings every app shares, and says whether this run has anything to do. The other jobs wait for it.
  config:
    runs-on: ubuntu-latest
    outputs:
      generate: ${{ steps.config.outputs.generate }}
      cleanup: ${{ steps.config.outputs.cleanup }}
      apk-path: ${{ steps.config.outputs.apk-path }}
      gradle-task: ${{ steps.config.outputs.gradle-task }}
      java-version: ${{ steps.config.outputs.java-version }}
      java-distribution: ${{ steps.config.outputs.java-distribution }}
      timezone: ${{ steps.config.outputs.timezone }}
      comment-header: ${{ steps.config.outputs.comment-header }}
    steps:
      - id: config
        uses: LukeNeedham/ci-workflows/.github/actions/app-config@main

  # Every app exposes its icon at a fixed path, app-icon.png in the repo root, so tooling such as the app
  # hub can fetch it. It is generated from the app's adaptive launcher icon, so it cannot drift: this job
  # renders it on every PR and, when it differs, commits it to the PR branch. The path is fixed and cannot
  # be overridden: it has to be the same in every app. Runs alongside the build. The steps are in
  # .github/actions/app-icon (docs/app-icon.md).
  # The push is made with the owner's token (GENERATED_COMMIT_TOKEN), so that the checks run on the new commit; a push with the
  # workflow token leaves them waiting for approval. That run has nothing to do (app_config.py skips a push that
  # changes only generated files), so there is no loop and no second build (the APK does not contain app-icon.png).
  # The three jobs that commit (this, screenshots and readme) each cancel their own older run for the PR: a run that
  # a newer push has replaced must not commit files made from the old code on top of the new.
  app-icon:
    needs: config
    if: needs.config.outputs.generate == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: android-pr-app-icon-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: LukeNeedham/ci-workflows/.github/actions/app-icon@main
        with:
          token: ${{ secrets.GENERATED_COMMIT_TOKEN }}

  # The screenshots of the README. They are rendered by the build job, in the same Gradle run as the APK, from the
  # @Preview of every composable of the app's screenshot package (an app without such a package, a WebView wrapper,
  # commits its screenshots by hand and has nothing rendered). This job commits them to the PR branch into
  # docs/screenshots/ when they differ. It is skipped when nothing was rendered, and fails when the rendering failed.
  # The steps are in .github/actions/screenshots (docs/screenshots.md).
  screenshots:
    needs: [config, build]
    if: ${{ !cancelled() && needs.config.outputs.generate == 'true' && contains(fromJSON('["rendered","failed"]'), needs.build.outputs.screenshots) }}
    runs-on: ubuntu-latest
    concurrency:
      group: android-pr-screenshots-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: LukeNeedham/ci-workflows/.github/actions/screenshots@main
        with:
          state: ${{ needs.build.outputs.screenshots }}
          token: ${{ secrets.GENERATED_COMMIT_TOKEN }}

  # Every @Preview of the app must render (docs/previews.md): the build job renders them after the APK, and this job fails
  # the PR when some did not, so such a PR cannot be merged. It only reports; the build job's log has the previews that failed.
  previews:
    needs: [config, build]
    if: ${{ !cancelled() && needs.config.outputs.generate == 'true' && needs.build.outputs.previews == 'failed' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::Some previews could not be rendered: see the 'Render the previews' step of the build job"
          exit 1

  # The README.md of every app is rendered from its readme.yml, in the layout of docs/readme.md, so the format
  # cannot drift. Render on every PR and commit the result to the PR branch when it differs. An app without a
  # readme.yml yet only gets a warning. It runs after the screenshots, which it shows: both commit to the PR
  # branch, and this one starts from their commit. The steps are in .github/actions/readme.
  readme:
    needs: [config, screenshots]
    if: ${{ !cancelled() && needs.config.outputs.generate == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: android-pr-readme-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - uses: LukeNeedham/ci-workflows/.github/actions/readme@main
        with:
          token: ${{ secrets.GENERATED_COMMIT_TOKEN }}

  build:
    needs: config
    if: needs.config.outputs.generate == 'true'
    uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_build.yml@main
    with:
      gradle-task: ${{ needs.config.outputs.gradle-task }}
      apk-path: ${{ needs.config.outputs.apk-path }}
      java-version: ${{ needs.config.outputs.java-version }}
      java-distribution: ${{ needs.config.outputs.java-distribution }}
      timezone: ${{ needs.config.outputs.timezone }}
      comment-header: ${{ needs.config.outputs.comment-header }}

  cleanup:
    needs: config
    if: needs.config.outputs.cleanup == 'true'
    uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_cleanup.yml@main

  # Merges the PR that sync_apps.yml opens (its title starts with [auto-merge], see scripts/automerge.py) once every job
  # above has passed or been skipped: a failed or cancelled job leaves it open. It runs in the run that did the work, after
  # the jobs that commit the generated files, so it merges the branch with those commits. It uses the owner's token
  # (GENERATED_COMMIT_TOKEN): a merge made with the workflow token starts no workflow, so build_main.yml would not run on
  # the merged commit. Without the secret it only says so. automerge.py checks the PR again before it merges.
  automerge:
    needs: [config, build, previews, screenshots, readme]
    if: >-
      ${{ !cancelled()
      && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
      && github.event_name == 'pull_request' && github.event.action != 'closed'
      && startsWith(github.event.pull_request.title, '[auto-merge]')
      && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: LukeNeedham/ci-workflows/.github/actions/ci-scripts@main

      - name: Merge the PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GENERATED_COMMIT_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::Not merged: this repo has no GENERATED_COMMIT_TOKEN secret (docs/sync.md)."
            exit 0
          fi
          python3 "$CI_SCRIPTS/automerge.py" --repo "$REPO" --pr "$PR" --run-sha "$RUN_SHA"
