name: Android Release

# Reusable workflow: publishes a permanent, signed release build with the APK attached. It tags the
# commit with the version, builds the release APK, checks it is signed, and publishes a normal
# (not pre-release) release, so android_pr_cleanup.yml and delete_prereleases.yml leave it alone and
# /releases/latest/download/<asset> always points at the newest.
#
# The app's version name and code are read from that tag by gradle/android-release.gradle, which
# the project must apply. The same script reads the signing key from the environment variables this
# workflow sets from the secrets below.
#
# Caller: callers/release.yml. Every app has it; it has no settings besides the version and notes.
# The caller must grant `contents: write` and pass the secrets (`secrets: inherit` does it). An app that is not
# set up for releases (secrets, the Gradle script) fails in the first step with a message that says what is missing.

on:
  workflow_call:
    inputs:
      version:
        description: 'Version as major.minor.patch, e.g. 0.3.0. Becomes the tag, with no v prefix'
        type: string
        required: true
      notes:
        description: Release notes. Empty lists the merged PRs
        type: string
        default: ''
      # The build settings are not inputs: every app is built the same way (docs/app-config.md).
    # Not `required`: an app that is not set up for releases still has this caller, and GitHub's own message for
    # a missing required secret is easy to miss. The first step below says what is missing instead.
    secrets:
      RELEASE_KEYSTORE_BASE64:
        description: The keystore file, base64 encoded on one line
        required: false
      RELEASE_KEYSTORE_PASSWORD:
        required: false
      RELEASE_KEY_ALIAS:
        required: false
      RELEASE_KEY_PASSWORD:
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - id: config
        uses: LukeNeedham/ci-workflows/.github/actions/app-config@main

      - uses: actions/checkout@v4

      # Every app has this caller, but only an app that was set up for releases can run it. Fail first, with
      # everything that is missing in one message, before anything is tagged or built.
      - name: Check the app is set up for releases
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          guide="https://github.com/LukeNeedham/ci-workflows/blob/main/docs/setup.md#3-permanent-releases-optional"
          failed=0
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(RELEASE_KEYSTORE_BASE64)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(RELEASE_KEYSTORE_PASSWORD)
          [ -n "$KEY_ALIAS" ] || missing+=(RELEASE_KEY_ALIAS)
          [ -n "$KEY_PASSWORD" ] || missing+=(RELEASE_KEY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=This repo cannot publish a release yet::Missing repo secrets: ${missing[*]}. Add them under Settings > Secrets and variables > Actions. How: $guide"
            failed=1
          fi
          if ! grep -rqs --include='*.gradle' --include='*.gradle.kts' 'android-release\.gradle' .; then
            echo "::error title=This repo cannot publish a release yet::The app's build.gradle.kts does not apply gradle/android-release.gradle, which sets the version from the tag and the release signing. How: $guide"
            failed=1
          fi
          exit $failed

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.3.0, got '$VERSION'"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "::error::Tag $VERSION already exists. Pick a new version."
            exit 1
          fi

      # The Gradle build takes the version name and code from the tag on the commit it builds, so
      # the commit is tagged first. The tag is removed again if anything below fails.
      - name: Tag this commit
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ steps.config.outputs.java-distribution }}
          java-version: ${{ steps.config.outputs.java-version }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret RELEASE_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GRADLE_TASK: ${{ steps.config.outputs.release-gradle-task }}
        run: ./gradlew "$GRADLE_TASK" --no-daemon

      - name: Check the APK is signed
        env:
          APK_PATH: ${{ steps.config.outputs.release-apk-path }}
        run: |
          if [ ! -f "$APK_PATH" ]; then
            echo "::error title=The release APK was not built::Expected it at $APK_PATH. Every app builds its release APK there (module app, ./gradlew assembleRelease)."
            exit 1
          fi
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$APK_PATH"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
          APK_PATH: ${{ steps.config.outputs.release-apk-path }}
          ASSET_NAME: ${{ steps.config.outputs.asset-name }}
        run: |
          cp "$APK_PATH" "$ASSET_NAME"
          if [ -n "$NOTES" ]; then notes=(--notes "$NOTES"); else notes=(--generate-notes); fi
          gh release create "$VERSION" "$ASSET_NAME" \
            --title "$VERSION" \
            --latest \
            "${notes[@]}"

      - name: Remove the tag if the release failed
        if: failure() && steps.tag.outcome == 'success'
        env:
          VERSION: ${{ inputs.version }}
        run: git push origin --delete "refs/tags/$VERSION"
