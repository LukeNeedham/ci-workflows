name: Sync Apps

# Keeps every app in apps.json in line with this repo: the Claude skill, the workflow callers and a managed
# block in the app's CLAUDE.md. For each app that differs it opens (or updates) one PR, "Sync from
# ci-workflows". The logic is scripts/sync_apps.py; setup, including the SYNC_TOKEN secret, is docs/sync.md.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'callers/**'
      - 'apps.json'
      - 'scripts/sync_apps.py'
  schedule:
    - cron: '17 5 * * 1'   # weekly, to catch an app that drifted
  workflow_dispatch:
    inputs:
      apps:
        description: Only these apps, comma-separated names or repos. Empty syncs all
        type: string
        default: ''
  pull_request:
    paths:
      - 'scripts/**'
      - 'apps.json'
      - 'callers/**'
      - 'skills/**'
      - '.github/workflows/sync_apps.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the sync script
        run: python3 -m unittest discover -s scripts

  sync:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One sync at a time: two would push the same branches
    concurrency:
      group: sync-apps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Sync the apps
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          APPS: ${{ inputs.apps }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::The secret SYNC_TOKEN is not set. See docs/sync.md."
            exit 1
          fi
          echo "::add-mask::$SYNC_TOKEN"
          python3 scripts/sync_apps.py ${APPS:+--apps "$APPS"}
