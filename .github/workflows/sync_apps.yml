name: Sync Apps

# Keeps every app in apps.json in line with this repo: the Claude skill, the workflow callers and a managed
# block in the app's CLAUDE.md. For each app that differs it opens (or updates) one PR, "Sync from
# ci-workflows". It also writes the secret GENERATED_COMMIT_TOKEN into every app. The logic is scripts/sync_apps.py;
# setup, including the SYNC_TOKEN and GENERATED_COMMIT_TOKEN secrets, is docs/sync.md.
#
# What starts a sync is the whole of scripts/: a change there reaches every app's CI (the code that the workflows
# and actions run on the apps, and the sync itself), the skill, the callers and apps.json. tests/ never does:
# nothing in it reaches an app. The tests run in test.yml.

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'callers/**'
      - 'apps.json'
      - 'scripts/**'
  schedule:
    - cron: '17 5 * * 1'   # weekly, to catch an app that drifted
  workflow_dispatch:
    inputs:
      apps:
        description: Only these apps, comma-separated names or repos. Empty syncs all
        type: string
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # One sync at a time: two would push the same branches
    concurrency:
      group: sync-apps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - run: pip install --quiet pyyaml pynacl

      - name: Sync the apps
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GENERATED_COMMIT_TOKEN: ${{ secrets.GENERATED_COMMIT_TOKEN }}
          APPS: ${{ inputs.apps }}
        run: python3 scripts/sync_apps.py ${APPS:+--apps "$APPS"}
