name: Android PR Build

# Reusable workflow: builds an Android APK, publishes it as a pre-release asset and posts/updates
# a sticky PR comment with the download link.
#
# Caller example:
#   jobs:
#     build:
#       uses: LukeNeedham/ci-workflows/.github/workflows/android_pr_build.yml@main
#       secrets: inherit
#
# The caller's `permissions:` cap what this workflow can do, so the caller must grant:
#   contents: write, pull-requests: write

on:
  workflow_call:
    inputs:
      gradle-task:
        description: Gradle task that produces the APK
        type: string
        default: assembleDebug
      apk-path:
        description: Path to the built APK, relative to the repo root
        type: string
        default: composeApp/build/outputs/apk/debug/composeApp-debug.apk
      java-version:
        type: string
        default: '17'
      java-distribution:
        type: string
        default: zulu
      timezone:
        description: Timezone used for the "Built at" timestamp
        type: string
        default: Europe/Amsterdam
      comment-header:
        description: Sticky comment id; change it if a PR needs several distinct APK comments
        type: string
        default: example-app-link

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Runs first so the PR shows a new build is coming as soon as the job starts. The previous
      # APK link is kept but flagged as stale. Skipped on manual dispatches (no PR to comment on).
      - name: Mark previous build as stale
        id: prev
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TZ_NAME: ${{ inputs.timezone }}
          HEADER: ${{ inputs.comment-header }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "short-sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "time=$(TZ="$TZ_NAME" date +'%d/%m/%Y %H:%M:%S')" >> "$GITHUB_OUTPUT"
          # The sticky comment action embeds this marker in the comment it manages
          OLD_BODY=$(gh api --paginate "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"Sticky Pull Request Comment${HEADER} \")) | .body" || true)
          OLD_URL=$(echo "$OLD_BODY" | grep -oE 'https://github\.com/[^ )]+/releases/download/[^ )]+\.apk' | head -n 1 || true)
          echo "old-url=$OLD_URL" >> "$GITHUB_OUTPUT"

      - name: Post build in progress on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ${{ inputs.comment-header }}
          message: |
            ### ⏳ Build in progress

            - **Commit:** [`${{ steps.prev.outputs.short-sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
            - **Started:** ${{ steps.prev.outputs.time }}
            - **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${{ steps.prev.outputs.old-url != '' && format('- **Previous APK:** [download]({0}) ⚠️ stale, does not include this commit', steps.prev.outputs.old-url) || '' }}

      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: gradle

      - name: Build APK
        shell: bash
        run: ./gradlew ${{ inputs.gradle-task }}

      - name: Compute build metadata
        id: meta
        shell: bash
        env:
          TZ_NAME: ${{ inputs.timezone }}
          APK_PATH: ${{ inputs.apk-path }}
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          echo "time=$(TZ="$TZ_NAME" date +'%d/%m/%Y %H:%M:%S')" >> "$GITHUB_OUTPUT"
          echo "apk-name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          # Slashes/special characters -> dashes, lowercase, plus run identifiers for uniqueness
          CLEAN_BRANCH=$(echo "$RAW_BRANCH" | sed 's/[^A-Za-z0-9._-]/-/g' | tr '[:upper:]' '[:lower:]')
          echo "tag=${CLEAN_BRANCH}-${{ github.run_number }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Create release and upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ inputs.apk-path }}
          tag: ${{ steps.meta.outputs.tag }}
          name: "PR Build: ${{ github.head_ref || github.ref_name }}"
          body: "Debug build generated automatically from branch: ${{ github.head_ref || github.ref_name }} at ${{ steps.meta.outputs.time }}"
          prerelease: true
          draft: false

      # Skipped on manual dispatches, which have no PR to comment on
      - name: Post APK link on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ${{ inputs.comment-header }}
          message: |
            ### ✅ Build succeeded

            - **APK:** 📦 [Download](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.apk-name }})
            - **Commit:** [`${{ steps.prev.outputs.short-sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
            - **Built:** ${{ steps.meta.outputs.time }}
            - **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # Don't leave the comment claiming a build is in progress if the job dies
      - name: Post build failed on PR
        if: github.event_name == 'pull_request' && (failure() || cancelled())
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ${{ inputs.comment-header }}
          message: |
            ### ${{ job.status == 'cancelled' && '🚫 Build cancelled' || '❌ Build failed' }}

            - **Commit:** [`${{ steps.prev.outputs.short-sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
            - **Started:** ${{ steps.prev.outputs.time }}
            - **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${{ steps.prev.outputs.old-url != '' && format('- **Previous APK:** [download]({0}) ⚠️ stale, does not include this commit', steps.prev.outputs.old-url) || '' }}

