name: Android PR Build

# Building block of android_pr.yml: builds an Android APK, publishes it as a pre-release asset and
# posts/updates a sticky PR comment with the download link, and posts the AppHub link (the PR's page in the
# AppHub app, https://www.lukeneedham.com/apphub/pr/<repo name>/<number>) once, as a comment of its own.
# Call android_pr.yml instead of this file; its config job provides the settings and passes them
# on, so every input here is required.
#
# The caller's `permissions:` cap what this workflow can do, so the caller must grant:
#   contents: write, pull-requests: write

on:
  workflow_call:
    inputs:
      gradle-task:
        description: Gradle task that produces the APK
        type: string
        required: true
      apk-path:
        description: Path to the built APK, relative to the repo root
        type: string
        required: true
      java-version:
        type: string
        required: true
      java-distribution:
        type: string
        required: true
      timezone:
        description: Timezone used for the timestamps
        type: string
        required: true
      comment-header:
        description: Sticky comment id
        type: string
        required: true
    outputs:
      previews:
        description: 'What became of the previews: rendered, failed (the previews job of android_pr.yml then fails the PR), or skipped (not a pull request)'
        value: ${{ jobs.build.outputs.previews }}
      screenshots:
        description: 'What became of the README screenshots: rendered (uploaded as the artifact screenshots), failed, or skipped (nothing to render)'
        value: ${{ jobs.build.outputs.screenshots }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      previews: ${{ steps.previews.outcome == 'success' && 'rendered' || (steps.previews.outcome == 'failure' && 'failed' || 'skipped') }}
      screenshots: ${{ steps.shots.outcome == 'success' && 'rendered' || (steps.shots.outcome == 'failure' && 'failed' || 'skipped') }}
    # A newer push to the same PR cancels the running build, so an older build cannot finish last
    # and overwrite the newer build's comment.
    concurrency:
      group: android-pr-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: LukeNeedham/ci-workflows/.github/actions/ci-scripts@main

      # The AppHub link depends only on the repo name and the PR number, so it is posted as soon as the job
      # starts and never changes. only_create leaves an existing comment alone: one comment per PR, however
      # many pushes and re-runs. Skipped on manual dispatches (no PR to comment on).
      - name: Post AppHub link on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: apphub-pr-link
          only_create: true
          message: |
            ### 📲 AppHub

            [Open this pull request in AppHub](https://www.lukeneedham.com/apphub/pr/${{ github.event.repository.name }}/${{ github.event.pull_request.number }})

      # Runs first so the PR shows a new build is coming as soon as the job starts. The previous
      # APK link is kept but flagged as stale. Skipped on manual dispatches (no PR to comment on).
      - name: Mark previous build as stale
        id: prev
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEADER: ${{ inputs.comment-header }}
          TZ_NAME: ${{ inputs.timezone }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >
          python3 "$CI_SCRIPTS/pr_releases.py" stale
          --repo "$REPO" --pr "$PR_NUMBER" --header "$HEADER" --timezone "$TZ_NAME" --sha "$HEAD_SHA"

      - name: Post build in progress on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ${{ inputs.comment-header }}
          message: |
            ### ⏳ Build in progress

            - **Commit:** [`${{ steps.prev.outputs.short-sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
            - **Started:** ${{ steps.prev.outputs.time }}
            - **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${{ steps.prev.outputs.old-url != '' && format('- **Previous APK:** [download]({0}) ⚠️ stale, does not include this commit', steps.prev.outputs.old-url) || '' }}

      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}

      # Caches build outputs as well as downloaded dependencies. PR builds only read the cache, so
      # PR branches do not fill it; runs on the default branch (such as a manual run there) write it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch }}

      - name: Build APK
        shell: bash
        run: ./gradlew ${{ inputs.gradle-task }} --no-daemon --build-cache

      - name: Compute build metadata
        id: meta
        shell: bash
        env:
          TZ_NAME: ${{ inputs.timezone }}
          APK_PATH: ${{ inputs.apk-path }}
          RAW_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: >
          python3 "$CI_SCRIPTS/pr_releases.py" meta
          --timezone "$TZ_NAME" --apk-path "$APK_PATH" --branch "$RAW_BRANCH"
          --run-number "${{ github.run_number }}" --run-attempt "${{ github.run_attempt }}"

      - name: Create release and upload APK
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ inputs.apk-path }}
          tag: ${{ steps.meta.outputs.tag }}
          name: "PR Build: ${{ github.head_ref || github.ref_name }}"
          body: "Debug build generated automatically from branch: ${{ github.head_ref || github.ref_name }} at ${{ steps.meta.outputs.time }}"
          prerelease: true
          draft: false

      # Skipped on manual dispatches, which have no PR to comment on
      - name: Post APK link on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ${{ inputs.comment-header }}
          message: |
            ### ✅ Build succeeded

            - **APK:** 📦 [Download](https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/${{ steps.meta.outputs.apk-name }})
            - **Commit:** [`${{ steps.prev.outputs.short-sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
            - **Built:** ${{ steps.meta.outputs.time }}
            - **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # The README screenshots, rendered after the APK is out, in the same Gradle run (the debug classes are already
      # built), from the @Preview composables of the app's screenshot package. They are only handed on as an artifact:
      # the screenshots job of android_pr.yml commits them to the PR branch. A failure does not fail the build (the APK
      # is fine); the screenshots job fails instead, and says to look here. Skipped for an app without such a package.
      - name: Check that the app has screenshots to render
        if: github.event_name == 'pull_request'
        id: shots-wanted
        run: python3 "$CI_SCRIPTS/screenshots_wanted.py" .

      - name: Render the screenshots
        id: shots
        if: github.event_name == 'pull_request' && steps.shots-wanted.outputs.skip != 'true'
        continue-on-error: true
        run: python3 "$CI_SCRIPTS/render_screenshots.py" --no-daemon --build-cache

      - name: Keep the screenshots for the job that commits them
        if: steps.shots.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: error
          # A re-run of the workflow uploads it again
          overwrite: true
          # Only a hand-over to the screenshots job: the committed PNGs in docs/screenshots/ are what the README shows
          retention-days: 1

      # Every @Preview of the app, rendered once more (the build is already done, so it is quick) and uploaded to this
      # build's release; the PR gets a comment with the previews that differ from the ones of main, which
      # android_previews_main.yml renders on each push to main (docs/previews.md). A preview that cannot be rendered does not
      # fail this job (the APK is fine): the previews job of android_pr.yml fails the PR instead.
      - name: Render the previews
        id: previews
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: python3 "$CI_SCRIPTS/previews.py" render --no-daemon --build-cache

      - name: Show the changed previews on the PR
        if: steps.previews.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 "$CI_SCRIPTS/previews.py" pr --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
          --tag "${{ steps.meta.outputs.tag }}" --sha "${{ github.event.pull_request.head.sha }}"
          --base "${{ github.event.pull_request.base.ref }}"

      # Don't leave the comment claiming a build is in progress if the job dies
      # A run cancelled by a newer push must stay quiet: the newer run owns the comment now.
      # Only a run cancelled by hand (head commit unchanged) reports "cancelled".
      - name: Check whether a newer push superseded this run
        id: superseded
        if: github.event_name == 'pull_request' && cancelled()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 "$CI_SCRIPTS/pr_releases.py" superseded --repo "$REPO" --pr "$PR_NUMBER" --sha "$RUN_SHA"

      - name: Post build failed on PR
        if: github.event_name == 'pull_request' && (failure() || (cancelled() && steps.superseded.outputs.superseded != 'true'))
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: ${{ inputs.comment-header }}
          message: |
            ### ${{ job.status == 'cancelled' && '🚫 Build cancelled' || '❌ Build failed' }}

            - **Commit:** [`${{ steps.prev.outputs.short-sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }})
            - **Started:** ${{ steps.prev.outputs.time }}
            - **Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            ${{ steps.prev.outputs.old-url != '' && format('- **Previous APK:** [download]({0}) ⚠️ stale, does not include this commit', steps.prev.outputs.old-url) || '' }}

