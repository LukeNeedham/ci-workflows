name: Delete PR build releases
description: Deletes the pre-releases (and tags) the PR build workflow created for a branch.

inputs:
  branch:
    description: PR head branch
    required: true
  token:
    description: Token with contents:write
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        GH_REPO: ${{ github.repository }}
        BRANCH: ${{ inputs.branch }}
      run: |
        TAGS=$(gh release list --limit 1000 --json tagName,isPrerelease \
          | python3 "${{ github.action_path }}/../branch-tag/branch_tag.py" select --branch "$BRANCH")

        if [ -z "$TAGS" ]; then
          echo "No PR build releases found for branch '$BRANCH'"
          exit 0
        fi

        while read -r tag; do
          echo "Deleting release and tag: $tag"
          gh release delete "$tag" --yes --cleanup-tag
        done <<< "$TAGS"
