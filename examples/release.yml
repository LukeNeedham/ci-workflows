# Synced from LukeNeedham/ci-workflows into every app by CI: do not edit it in an app. It has no settings.
# Run it from the Actions tab. An app that is not set up for releases fails at once with a message that says
# what is missing. To publish, it needs the Gradle script applied in the app (see docs/setup.md) and four repo secrets:
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# Docs: https://github.com/LukeNeedham/ci-workflows/blob/main/docs/setup.md
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, as major.minor.patch (e.g. 0.3.0)'
        required: true
        type: string
      notes:
        description: 'Release notes (leave empty to list the merged PRs)'
        required: false
        type: string
        default: ''

permissions:
  contents: write       # create the tag and the release

jobs:
  release:
    uses: LukeNeedham/ci-workflows/.github/workflows/android_release.yml@main
    with:
      version: ${{ inputs.version }}
      notes: ${{ inputs.notes }}
    secrets: inherit
