# Synced from LukeNeedham/ci-workflows into every app by CI: do not edit it in an app. It has no settings.
# The file name matters: AppHub starts it by name.
# Run it from the Actions tab (Run workflow, on main), or from AppHub. It builds the branch it is run on
# and keeps the APK as an artifact for one day.
# Docs: https://github.com/LukeNeedham/ci-workflows/blob/main/docs/app-config.md
name: Build Main

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    uses: LukeNeedham/ci-workflows/.github/workflows/android_main_build.yml@main
