# Synced from LukeNeedham/ci-workflows into every app by CI: do not edit it in an app. It has no settings.
# The app's settings (APK path, branches and so on) are its entry in ci-workflows' apps.json.
# Docs: https://github.com/LukeNeedham/ci-workflows/blob/main/docs/app-config.md
name: On Pull Request

on:
  workflow_dispatch: {}
  pull_request:
    # `closed` runs the release cleanup, the other types run the build. Keep all four. Which branches PRs
    # are built for is the app's `branches` in apps.json.
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write       # create the release that holds the APK, and delete it again
  pull-requests: write  # post the sticky comment

jobs:
  android:
    uses: LukeNeedham/ci-workflows/.github/workflows/android_pr.yml@main
