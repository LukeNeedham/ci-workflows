// A Gradle init script that renders the README screenshots of an app: docs/screenshots.md in LukeNeedham/ci-workflows.
//
// It is applied from outside, with `--init-script`, by scripts/render_screenshots.py, so the app's own build files
// hold nothing for it. For the run it adds the test dependencies (the versions are here and only here), turns on
// Android resources for unit tests, and generates the test class PageScreenshotTest from the template given as the
// project property screenshots.template. That test renders every @Preview of the screenshot package of the app's
// namespace to build/screenshots/<Name>.png of the app module.

allprojects {
    pluginManager.withPlugin('com.android.application') {
        def templatePath = findProperty('screenshots.template')
        if (templatePath == null) {
            throw new GradleException('Pass the test template: -Pscreenshots.template=<path to PageScreenshotTest.kt.template>')
        }
        def template = file(templatePath)
        def generatedDir = layout.buildDirectory.dir('generated/screenshotTest/kotlin')

        android {
            testOptions {
                unitTests {
                    includeAndroidResources = true
                }
            }
        }

        dependencies {
            // The versions of the screenshot test: change them here, for every app at once
            testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.76.0'
            testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.76.0'
            testImplementation 'org.robolectric:robolectric:4.14.1'
            testImplementation 'io.github.sergio-sastre.ComposablePreviewScanner:android:0.9.3'
            // Versioned by the app's Compose BOM
            testImplementation 'androidx.compose.ui:ui-test-junit4'
            debugImplementation 'androidx.compose.ui:ui-test-manifest'
        }

        def generate = tasks.register('generatePageScreenshotTest') {
            inputs.file(template)
            outputs.dir(generatedDir)
            doLast {
                def namespace = project.android.namespace
                def file = new File(generatedDir.get().asFile, 'PageScreenshotTest.kt')
                file.parentFile.mkdirs()
                file.text = template.text.replace('{{PACKAGE}}', namespace)
            }
        }
        // The run renders screenshots and nothing else, so the test source set holds only the generated test: the app's
        // own unit tests are not compiled, and a broken one cannot fail the screenshots
        android.sourceSets.matching { it.name ==~ /test([A-Z].*)?/ }.configureEach { sourceSet ->
            def own = sourceSet.name == 'test' ? [generatedDir.get().asFile] : []
            sourceSet.java.setSrcDirs(own)
            sourceSet.extensions.findByName('kotlin')?.setSrcDirs(own)
        }
        tasks.configureEach { task ->
            if (task.name ==~ /compile.*UnitTestKotlin/) task.dependsOn(generate)
        }

        tasks.withType(Test).configureEach {
            // Roborazzi writes the images it captures only when asked to record
            systemProperty 'roborazzi.test.record', 'true'
            // The images are the only output that matters, and Gradle does not know them: never skip the run as up to
            // date or take it from the build cache, or nothing would be rendered
            outputs.upToDateWhen { false }
            outputs.cacheIf { false }
        }
    }
}
