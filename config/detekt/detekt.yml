# Shared Detekt rules for every consuming app. Written for Detekt 1.23.x.
#
# Apps do NOT copy this file: the shared Gradle script (gradle/android-detekt.gradle) fetches it from
# this repo, so a change here reaches every app. Docs: docs/app-conventions.md#detekt
#
# It is layered on top of Detekt's defaults (buildUponDefaultConfig = true), so only what differs from
# the defaults is listed. Style is not enforced here (no ktlint/formatting ruleset): this file is about
# bugs, complexity and the app conventions.

build:
  maxIssues: 0

config:
  validation: true
  warningsAsErrors: false

# Jetpack Compose code is long, deeply nested, takes many parameters (state down, events up) and uses
# PascalCase function names by design, so @Composable functions are exempt from the size and naming
# rules. @Preview functions are private and unused by design.
complexity:
  LongMethod:
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  NestedBlockDepth:
    ignoreAnnotated: ['Composable']
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']
    ignoreOverridden: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'

empty-blocks:
  EmptyFunctionBlock:
    ignoreOverridden: true

style:
  MagicNumber:
    ignoreAnnotated: ['Composable']
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreEnums: true
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
  # The app conventions (docs/app-conventions.md) as rules. Everything not listed is allowed.
  ForbiddenImport:
    active: true
    imports:
      # Logging goes through the shared library's Logger
      - value: 'android.util.Log'
        reason: 'Use Logger from the shared common library.'
      # The app never reads MaterialTheme: it reads its own AppTheme
      - value: 'androidx.compose.material3.MaterialTheme'
        reason: 'Read the colours and typefaces from AppTheme, not MaterialTheme.'
      - value: 'androidx.compose.material.MaterialTheme'
        reason: 'Read the colours and typefaces from AppTheme, not MaterialTheme.'
      # One library per job
      - value: 'android.content.SharedPreferences'
        reason: 'Use DataStore.'
      - value: 'com.bumptech.glide.*'
        reason: 'Use Coil 3.'
      - value: 'com.squareup.picasso.*'
        reason: 'Use Coil 3.'
      - value: 'coil.*'
        reason: 'Use Coil 3 (coil3.*), not Coil 2.'
      - value: 'retrofit2.*'
        reason: 'Use Ktor.'
      - value: 'org.joda.time.*'
        reason: 'Use kotlinx-datetime.'
      - value: 'com.google.gson.*'
        reason: 'Use kotlinx.serialization.'
      - value: 'com.squareup.moshi.*'
        reason: 'Use kotlinx.serialization.'
